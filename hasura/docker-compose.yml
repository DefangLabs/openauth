version: "3.7"

services:
  hasura-postgres:
    restart: unless-stopped
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - "hasura-db:/var/lib/postgresql/data:rw"

  hasura:
    restart: unless-stopped
    env_file:
      - ./hasura/.env
    depends_on:
      - hasura-postgres
    build:
      context: hasura
    volumes:
      - ./hasura:/project
    ports:
      - 5000:8080

volumes:
  hasura-db:
