table:
  name: users
  schema: public
array_relationships:
  - name: usersUserAccounts
    using:
      foreign_key_constraint_on:
        column: userId
        table:
          name: userAccounts
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        id:
          _eq: X-Hasura-User-Id
      set:
        id: x-hasura-User-Id
      columns:
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - email
        - id
        - name
      filter:
        id:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
      filter:
        id:
          _eq: X-Hasura-User-Id
      check:
        id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        id:
          _eq: X-Hasura-User-Id
event_triggers:
  - name: userInserted
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 15
      num_retries: 3
      timeout_sec: 30
    webhook: '{{DEFANG_FN_ENDPOINT}}/hasura/events'
    headers:
      - name: Authorization
        value_from_env: DEFANG_API_SECRET
  - name: userUpdated
    definition:
      enable_manual: false
      update:
        columns: '*'
    retry_conf:
      interval_sec: 15
      num_retries: 3
      timeout_sec: 30
    webhook: '{{DEFANG_FN_ENDPOINT}}/hasura/events'
    headers:
      - name: Authorization
        value_from_env: DEFANG_API_SECRET
