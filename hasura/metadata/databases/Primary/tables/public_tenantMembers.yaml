table:
  name: tenantMembers
  schema: public
object_relationships:
  - name: tenant
    using:
      foreign_key_constraint_on: tenantId
  - name: tenantRole
    using:
      foreign_key_constraint_on: role
  - name: user
    using:
      foreign_key_constraint_on: userId
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - tenant:
              ownerId:
                _eq: X-Hasura-User-Id
      columns:
        - role
        - tenantId
        - userId
select_permissions:
  - role: user
    permission:
      columns:
        - role
        - createdAt
        - updatedAt
        - tenantId
        - userId
      filter:
        _or:
          - tenant:
              ownerId:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - role
      filter:
        _or:
          - tenant:
              ownerId:
                _eq: X-Hasura-User-Id
      check:
        _or:
          - tenant:
              ownerId:
                _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - tenant:
              ownerId:
                _eq: X-Hasura-User-Id
