table:
  name: tenants
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: ownerId
array_relationships:
  - name: tenantMembers
    using:
      foreign_key_constraint_on:
        column: tenantId
        table:
          name: tenantMembers
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        ownerId:
          _eq: X-Hasura-User-Id
      set:
        ownerId: x-hasura-User-Id
      columns:
        - id
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - name
        - createdAt
        - updatedAt
        - id
        - ownerId
      filter:
        _or:
          - ownerId:
              _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        ownerId:
          _eq: X-Hasura-User-Id
event_triggers:
  - name: tenantAwsMarketplaceUpdated
    definition:
      enable_manual: true
      update:
        columns:
          - id
          - awsMarketplaceProductCode
          - awsMarketplaceCustomerIdentifier
          - awsMarketplaceAccountId
    retry_conf:
      interval_sec: 10
      num_retries: 4
      timeout_sec: 60
    webhook: "{{DEFANG_FABRIC}}/aws-marketplace"
    headers:
      - name: Authorization
        value_from_env: DEFANG_FABRIC_SHARED_SECRET
