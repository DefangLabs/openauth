table:
  name: tenants
  schema: public
object_relationships:
  - name: owner
    using:
      foreign_key_constraint_on: ownerId
array_relationships:
  - name: tenantMembers
    using:
      foreign_key_constraint_on:
        column: tenantId
        table:
          name: tenantMembers
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        ownerId:
          _eq: X-Hasura-User-Id
      set:
        ownerId: x-hasura-User-Id
      columns:
        - id
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - awsMarketplaceAccountId
        - awsMarketplaceCustomerIdentifier
        - awsMarketplaceProductCode
        - createdAt
        - id
        - name
        - ownerId
        - provider
        - updatedAt
      filter:
        _or:
          - ownerId:
              _eq: X-Hasura-User-Id
event_triggers:
  - name: tenantAwsMarketplaceUpdated
    definition:
      enable_manual: true
      update:
        columns:
          - id
          - awsMarketplaceProductCode
          - awsMarketplaceCustomerIdentifier
          - awsMarketplaceAccountId
    retry_conf:
      interval_sec: 10
      num_retries: 4
      timeout_sec: 60
    webhook: '{{DEFANG_FABRIC}}/aws-marketplace'
    headers:
      - name: Authorization
        value_from_env: DEFANG_FABRIC_SHARED_SECRET
  - name: tenantDeleted
    definition:
      delete:
        columns: '*'
      enable_manual: false
    retry_conf:
      interval_sec: 15
      num_retries: 3
      timeout_sec: 30
    webhook: '{{DEFANG_FN_ENDPOINT}}/hasura/events'
    headers:
      - name: Authorization
        value_from_env: DEFANG_API_SECRET
  - name: tenantInserted
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 15
      num_retries: 3
      timeout_sec: 30
    webhook: '{{DEFANG_FN_ENDPOINT}}/hasura/events'
    headers:
      - name: Authorization
        value_from_env: DEFANG_API_SECRET
  - name: tenantUpdated
    definition:
      enable_manual: false
      update:
        columns:
          - ownerId
    retry_conf:
      interval_sec: 15
      num_retries: 3
      timeout_sec: 30
    webhook: '{{DEFANG_FN_ENDPOINT}}/hasura/events'
    headers:
      - name: Authorization
        value_from_env: DEFANG_API_SECRET
