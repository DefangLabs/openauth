actions:
  - name: createStripeCheckoutSession
    definition:
      kind: synchronous
      handler: '{{DEFANG_FN_ENDPOINT}}/stripe/checkout'
      forward_client_headers: true
    permissions:
      - role: user
  - name: createStripePortalSession
    definition:
      kind: synchronous
      handler: '{{DEFANG_FN_ENDPOINT}}/stripe/portal'
      forward_client_headers: true
    permissions:
      - role: user
    comment: Create a Stripe portal session
  - name: createStripeSecret
    definition:
      kind: synchronous
      handler: '{{DEFANG_FN_ENDPOINT}}/stripe/secret'
      forward_client_headers: true
      timeout: 5
    permissions:
      - role: user
    comment: Create a Stripe client secret
  - name: deleteUser
    definition:
      kind: synchronous
      handler: '{{DEFANG_FN_ENDPOINT}}/users'
      forward_client_headers: true
      request_transform:
        method: DELETE
        query_params: {}
        template_engine: Kriti
        version: 2
    permissions:
      - role: user
  - name: initiateTenantDeletion
    definition:
      kind: synchronous
      handler: '{{DEFANG_FN_ENDPOINT}}/tenants'
      forward_client_headers: true
      request_transform:
        method: DELETE
        query_params: {}
        template_engine: Kriti
        url: '{{$base_url}}/{{$body.input.tenantId}}'
        version: 2
    permissions:
      - role: user
  - name: resolveAwsMarketplaceCustomer
    definition:
      kind: synchronous
      handler: '{{DEFANG_FN_ENDPOINT}}/aws-marketplace/resolve'
      forward_client_headers: true
    permissions:
      - role: user
custom_types:
  enums: []
  input_objects:
    - name: CreateStripeCheckoutSessionInput
    - name: ResolveAwsMarketplaceCustomerInput
  objects:
    - name: DeleteUserOutput
    - name: CreateStripeSecretOutput
    - name: CreateStripePortalSessionOutput
    - name: CreateStripeCheckoutSessionOutput
    - name: InitiateTenantDeletionOutput
    - name: ResolveAwsMarketplaceCustomerOutput
  scalars: []
