overwrite: true
schema: ../api/schema.graphql
documents: src/**/*.graphql
generates:
  src/generated/graphql/index.tsx:
    plugins:
      - add
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      defaultScalarType: unknown
      content: |
        // THIS FILE IS GENERATED, DO NOT EDIT!
      scalars:
        ConnectionCursor: string
        DateTime: string
        # Upload: unknown
    hooks:
      afterOneFileWrite:
        - eslint --fix
        - prettier --write
  src/generated/graphql/fragment-matcher.ts:
    plugins:
      - fragment-matcher
    hooks:
      afterOneFileWrite:
        - eslint --fix
        - prettier --write