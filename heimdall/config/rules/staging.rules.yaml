version: "1"
rules:
  - id: "ory:kratos:public"
    upstream: "http://kratos:4433"
    # upstream: "${INTERNAL_KRATOS_PUBLIC_URL}"
    match:
      url: "http://localhost:5000/.ory/kratos/public<**>"
      # url: "${EXTERNAL_KRATOS_PUBLIC_URL}<.*>"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
    execute:
      - authenticator: noop
      - authorizer: allow_all_requests
      - unifier: noop

