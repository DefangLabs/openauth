version: "3.7"

services:
  oathkeeper:
    image: oryd/oathkeeper:v0.40
    ports:
      - 4455:4455
      - 4456:4456
    depends_on:
      - kratos
    command:
      serve proxy -c "/etc/config/oathkeeper/oathkeeper.yml"
    environment:
      - LOG_LEVEL=debug
    restart: on-failure
    volumes:
      - ./oathkeeper/config:/etc/config/oathkeeper