version: "3.7"

services:
  oathkeeper:
    image: oryd/oathkeeper:v0.40
    ports:
      - 5000:4455 # App
      - 4455:4455 # Oathkeeper proxy
      - 4456:4456 # Oathkeeper aip
    depends_on:
      - kratos
    command:
      serve proxy -c "/etc/config/oathkeeper/oathkeeper.yml"
    environment:
      - LOG_LEVEL=debug
    restart: on-failure
    volumes:
      - ./oathkeeper/config:/etc/config/oathkeeper
    extra_hosts:
      - "host.docker.internal:host-gateway"