- id: "nextjs:public"
  upstream:
    preserve_host: true
    url: "http://host.docker.internal:3000"
  match:
    # url: "http://localhost:5000/auth"
    url: "http://localhost:5000<(?!\\/\\.).*>"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
  authenticators:
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: noop
    
- id: "ory:kratos:public"
  upstream:
    preserve_host: true
    url: "http://kratos:4433"
    strip_path: /.ory/kratos/public
  match:
    url: "http://localhost:5000/.ory/kratos/public<.*>"
    methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
  authenticators:
    - handler: noop
  authorizer:
    handler: allow
  mutators:
    - handler: noop

