version: v0.13.0

dsn: memory

serve:
  public:
    base_url: http://localhost:5000
    cors:
      enabled: true
      allowed_origins:
        - "http://localhost:5000"
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:5000
  allowed_return_urls:
    - http://localhost:5000/auth
    - http://localhost:5000

  methods:
    # totp:
    #   config:
    #     issuer: Kratos
    #   enabled: true
    # lookup_secret:
    #   enabled: true
    # link:
    #   enabled: true
    # code:
    #   enabled: true
    password:
      enabled: false
    oidc:
      enabled: true
      config:
        providers:
          - id: github
            provider: github
            client_id: 530ac29eb81d95ec590e
            client_secret: 4896183459ab24a1ffc5bfe1092e5679a7eccc21
            mapper_url: file:///etc/config/kratos/github-data-mapping.jsonnet
            scope:
              - user:email
              - read:user

  flows:
    error:
      ui_url: http://localhost:5000/auth/error

    settings:
      ui_url: http://localhost:5000/auth/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: http://localhost:5000/auth/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://localhost:5000/auth/verification
      use: code
      after:
        default_browser_return_url: http://localhost:5000/auth/login

    logout:
      after:
        default_browser_return_url: http://localhost:5000/auth/login

    login:
      ui_url: http://localhost:5000/auth/login
      lifespan: 10m

    registration:
      lifespan: 10m
      ui_url: http://localhost:5000/auth/login
      # after:
      #   password:
      #     hooks:
      #       - hook: session
      #       - hook: show_verification_ui

log:
  level: debug
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
