name: Build on PR

on:
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd web
        npm install -g pnpm
        pnpm install --frozen-lockfile

    - name: Run build
      run: |
        cd web
        pnpm run build